<text x="40" y="808" font-size="12" fill="#666" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Arial">Fit balance plug LAST, after measuring the voltage steps above on the plug pins.  Unused balance wires on a 3S–20S harness: follow the BMS manual (do not leave bare ends loose).</text>
