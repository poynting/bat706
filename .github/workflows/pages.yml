# Publish to GitHub Pages on every push to main:
#   index.html  the 3D viewer (self-contained; built locally with viewer/build_viewer.py and committed)
#   bom.html    BOM.md rendered here by viewer/build_bom.py, so it always matches BOM.md
#   stl/*.stl   the printable parts from cad/out/ (downloads linked from both pages)
# CI never needs CadQuery: the STLs and the viewer are built locally and committed.
name: Publish viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render BOM
        run: |
          pip install markdown==3.10.3
          python viewer/build_bom.py
      - name: Stage site
        run: |
          mkdir -p _site/stl
          cp viewer/index.html viewer/bom.html _site/
          cp cad/out/base.stl cad/out/spacer.stl cad/out/lid.stl cad/out/pp_clamp.stl cad/out/nut_plug_x6.stl _site/stl/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
